{% extends "layouts/auth.html" %}
{% block title %}Password updated · {{ GYM_NAME }}{% endblock %}
{% block auth_content %}
<div class="text-center">
  <div class="mx-auto mb-3 bg-success-subtle text-success" style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem"><i class="bi bi-check2-circle"></i></div>
  <h2 class="mb-2">Password updated</h2>
  <p class="text-muted">Your password has been set. You can now sign in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2"><i class="bi bi-box-arrow-in-right me-1"></i>Sign in</a>
</div>
{% endblock %}
