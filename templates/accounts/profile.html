{% extends "base.html" %}
{% block page_actions %}
<a href="{% url 'accounts:password_change' %}" class="btn btn-light border"><i class="bi bi-key me-1"></i>Change password</a>
<a href="{% url 'accounts:profile_edit' %}" class="btn btn-primary"><i class="bi bi-pencil me-1"></i>Edit profile</a>
{% endblock %}
{% block content %}
<div class="row g-4">
  <div class="col-lg-4">{% include "accounts/_user_summary.html" %}</div>
  <div class="col-lg-8">
    <div class="card h-100">
      <div class="card-header"><h2>My recent activity</h2></div>
      <div class="card-body">{% include "components/activity_feed.html" with activities=activities %}</div>
    </div>
  </div>
</div>
{% endblock %}
