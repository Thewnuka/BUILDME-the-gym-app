<aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
  <a href="{% url 'dashboard:home' %}" class="sidebar-brand">
    <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>
    <span>
      <span class="brand-name d-block">{{ GYM_NAME }}</span>
      <span class="brand-sub">Gym Management</span>
    </span>
  </a>
  <nav class="sidebar-nav">
    {% for section in nav_sections %}
      <div class="sidebar-section">{{ section.title }}</div>
      {% for item in section.items %}
        {% if item.coming_soon %}
          <span class="sidebar-link disabled" title="Available in an upcoming release" aria-disabled="true">
            <i class="bi bi-{{ item.icon }}"></i><span>{{ item.label }}</span><span class="badge-soon">Soon</span>
          </span>
        {% else %}
          <a href="{{ item.url }}" class="sidebar-link{% if item.active %} active{% endif %}"{% if item.active %} aria-current="page"{% endif %}>
            <i class="bi bi-{{ item.icon }}"></i><span>{{ item.label }}</span>
          </a>
        {% endif %}
      {% endfor %}
    {% endfor %}
  </nav>
  <div class="sidebar-footer">
    <div class="d-flex align-items-center gap-2">
      <span class="avatar avatar-sm">{{ user.initials }}</span>
      <div class="min-w-0">
        <div class="text-white text-truncate fw-semibold">{{ user }}</div>
        <div class="text-truncate" style="color: var(--gym-sidebar-muted)">{{ user.get_role_display }}</div>
      </div>
    </div>
  </div>
</aside>
