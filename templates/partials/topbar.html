<header class="app-topbar">
  <button type="button" class="btn btn-light topbar-toggle" data-sidebar-toggle aria-controls="appSidebar" aria-expanded="false" aria-label="Toggle navigation">
    <i class="bi bi-list fs-5"></i>
  </button>
  <div class="d-none d-md-flex align-items-center text-muted small gap-2">
    <i class="bi bi-calendar3"></i> {% now "l, F j, Y" %}
  </div>
  <div class="ms-auto d-flex align-items-center gap-2">
    <a href="{% url 'notifications:list' %}" class="btn btn-light border position-relative" aria-label="Notifications{% if unread_notifications %} ({{ unread_notifications }} unread){% endif %}">
      <i class="bi bi-bell"></i>
      {% if unread_notifications %}<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">{{ unread_notifications }}</span>{% endif %}
    </a>
    <div class="dropdown">
      <button class="user-menu-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar avatar-sm">{{ user.initials }}</span>
        <span class="d-none d-sm-block text-start lh-sm">
          <span class="d-block fw-semibold small">{{ user }}</span>
          <span class="d-block text-muted" style="font-size:.72rem">{{ user.get_role_display }}</span>
        </span>
        <i class="bi bi-chevron-down small text-muted"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>My Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2"></i>Change Password</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}" data-no-loading>
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
